<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
     role="img" aria-label="github-desc-rewriter — 批量重写 GitHub 仓库 description">
  <title>github-desc-rewriter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f7f5ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>

    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="20" y1="16" x2="92" y2="112">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.45" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <ellipse cx="600" cy="112" rx="400" ry="180" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="1010" cy="330" rx="280" ry="150" fill="url(#glow2)" filter="url(#soft)"/>
  <ellipse cx="150" cy="40" rx="240" ry="120" fill="url(#glow2)" filter="url(#soft)"/>

  <!-- logo mark -->
  <g transform="translate(526.4 36.4) scale(1.15)"
     fill="none" stroke="url(#mark)" stroke-linecap="round">
    <rect x="20" y="16" width="88" height="96" rx="10" stroke-width="2.2"/>
    <line x1="32" y1="40"  x2="48" y2="40" stroke-width="3.2"/>
    <line x1="60" y1="40"  x2="84" y2="40" stroke-width="3.2"/>
    <line x1="32" y1="64"  x2="80" y2="64" stroke-width="3.2"/>
    <line x1="32" y1="88"  x2="50" y2="88" stroke-width="3.2"/>
    <line x1="64" y1="88"  x2="92" y2="88" stroke-width="3.2"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="242" text-anchor="middle" fill="url(#wm)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.6">
    github-desc-rewriter
  </text>

  <!-- subtitle -->
  <text x="600" y="288" text-anchor="middle" fill="#475569"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400">
    把一个用户名下的所有仓库 description，批量重写成统一的中文结构化格式
  </text>

  <!-- platform chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="15" font-weight="500" fill="#334155">
    <rect x="355" y="316" width="128" height="34" rx="17" fill="#0f172a" fill-opacity="0.04" stroke="#0f172a" stroke-opacity="0.12"/>
    <text x="419" y="338" text-anchor="middle">Claude Code</text>

    <rect x="497" y="316" width="112" height="34" rx="17" fill="#0f172a" fill-opacity="0.04" stroke="#0f172a" stroke-opacity="0.12"/>
    <text x="553" y="338" text-anchor="middle">Codex CLI</text>

    <rect x="623" y="316" width="104" height="34" rx="17" fill="#0f172a" fill-opacity="0.04" stroke="#0f172a" stroke-opacity="0.12"/>
    <text x="675" y="338" text-anchor="middle">OpenCode</text>

    <rect x="741" y="316" width="104" height="34" rx="17" fill="#0f172a" fill-opacity="0.04" stroke="#0f172a" stroke-opacity="0.12"/>
    <text x="793" y="338" text-anchor="middle">EasyCode</text>
  </g>
</svg>
